# Unifies the frontend's static origin and the gateway's WebSocket/OAuth2
# origin behind one browser-facing port (issue #103, ADR 0031) - local dev
# only, no TLS. Routes gateway paths to `gateway`, everything else to
# `frontend`, rather than absorbing static-serving itself - matches this
# repo's one-container-per-concern pattern (ADR 0022) and keeps this file a
# pure routing layer for a later TLS pass to build on.

# WebSocket upgrade only when the client actually asks for it - the standard
# nginx idiom, since `Connection: upgrade` can't be a plain proxy_set_header
# (a non-WS request must get `Connection: close`/keep-alive instead).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # nginx's proxy_pass does NOT forward the client's original Host header
    # by default (it sends Host: gateway:8080 instead) - Spring Security's
    # oauth2Login redirect-uri template ("{baseUrl}/login/oauth2/code/...")
    # derives {baseUrl} from the incoming request's Host header at runtime,
    # so without this the redirect_uri sent to Keycloak stops matching the
    # registered http://localhost:8080/... and login fails with a confusing
    # Keycloak-side error. See gateway/application.yml's matching comment.
    #
    # Deliberately $http_host, not $host: nginx's $host strips the port
    # from the Host header entirely (a documented nginx behavior, not a
    # typo) - forwarding it as-is here silently dropped ":8080" from the
    # browser's Host header, breaking the redirect_uri the same way not
    # forwarding Host at all would have. $http_host is the client's Host
    # header taken verbatim, port included.
    location ^~ /oauth2/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
    }

    location ^~ /login/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
    }

    location = /logout {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
    }

    location = /ws {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The price-tick WebSocket connection is long-lived - nginx's 60s
        # default read timeout would silently kill it on any quiet gap.
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $http_host;
    }
}
