name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.check.outputs.frontend }}
      services: ${{ steps.check.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f gateway/build.gradle ]; then
            echo "services=true" >> "$GITHUB_OUTPUT"
          else
            echo "services=false" >> "$GITHUB_OUTPUT"
          fi

  # gateway, market-data-service, trading-service. One matrix job covers
  # all three rather than three duplicated jobs. gateway and trading-service
  # both have integration-tagged tests (real Testcontainers-backed
  # RabbitMQ/Redis/Postgres wiring); market-data-service stays on unit tests
  # only until it needs one (see docs/testing.md: only add the task/tests
  # when a change genuinely crosses a boundary).
  services:
    needs: detect
    if: needs.detect.outputs.services == 'true'
    strategy:
      matrix:
        service: [gateway, market-data-service, trading-service]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew test
      - name: Integration tests
        if: matrix.service == 'gateway' || matrix.service == 'trading-service'
        run: ./gradlew integrationTest
      - name: Coverage report
        run: ./gradlew jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-coverage-report
          path: ${{ matrix.service }}/build/reports/jacoco

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            PCT=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
            echo "**Frontend line coverage:** ${PCT}%" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage
