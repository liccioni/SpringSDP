name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.check.outputs.backend }}
      frontend: ${{ steps.check.outputs.frontend }}
      services: ${{ steps.check.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f backend/build.gradle ] || [ -f backend/build.gradle.kts ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f frontend/package.json ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f gateway/build.gradle ]; then
            echo "services=true" >> "$GITHUB_OUTPUT"
          else
            echo "services=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew test
      - name: Integration tests
        run: ./gradlew integrationTest
      - name: Coverage report
        run: ./gradlew jacocoTestReport
      - name: Coverage summary
        if: always()
        run: |
          CSV=$(find build/reports/jacoco -name '*.csv' | head -n1)
          if [ -n "$CSV" ]; then
            awk -F, 'NR>1 {mi+=$8; ci+=$9} END {if (mi+ci>0) printf "**Backend line coverage:** %.1f%%\n", (ci/(mi+ci))*100; else print "**Backend line coverage:** n/a"}' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/build/reports/jacoco

  # The three skeleton services from #89: gateway, market-data-service,
  # trading-service. Structurally identical for now (bare Spring Boot app +
  # actuator health), so one matrix job covers all three rather than
  # duplicating the `backend` job three times. No integrationTest task -
  # none of the three has an integration test yet (see docs/testing.md: only
  # add one when a change genuinely crosses a boundary).
  services:
    needs: detect
    if: needs.detect.outputs.services == 'true'
    strategy:
      matrix:
        service: [gateway, market-data-service, trading-service]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew test
      - name: Coverage report
        run: ./gradlew jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.service }}-coverage-report
          path: ${{ matrix.service }}/build/reports/jacoco

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            PCT=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
            echo "**Frontend line coverage:** ${PCT}%" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage
