services:
  # Terminates the real WebSocket connection and the OAuth2 login flow.
  # No longer the service exposed to the browser as of issue #103/ADR 0031 -
  # `proxy` below took over that role, reusing gateway's own 8080 default so
  # VITE_WS_URL/VITE_LOGIN_URL and Keycloak's registered redirectUris didn't
  # need to change. See ADR 0022 for the service boundaries and the
  # strangler-fig migration (#90-#94) that got here.
  gateway:
    image: sdp-gateway:latest
    # Dual-network: `public` so `proxy` can reach it, `internal` so it can
    # reach redis/rabbitmq directly - ADR 0021's "only the actual Gateway
    # joins public" undersold this at the time it was written, before it
    # was clear Gateway itself (not just the browser) needs direct
    # connectivity to services living on `internal`. Market Data/
    # Backend-Trading stay internal-only since neither is exposed to the
    # browser or needs to be reached from it.
    networks:
      - public
      - internal
    # No host-published port as of issue #103/ADR 0031 - `proxy` is now the
    # sole browser-facing container on port 8080; gateway is reachable only
    # from `proxy` over the `public` network. The "Without Docker" native
    # dev path (README.md) still runs gateway as a bare process with no
    # proxy involved, unaffected by this.
    environment:
      SPRING_DATA_REDIS_HOST: redis
      # Consumer of market-data-service's PRICE_TICK fanout exchange (issue
      # #90) and trading-service's TRADE_CREATED/TRADE_REJECTED fanout
      # exchanges (issue #91); publisher of SESSION_STARTED (#93) and
      # LOGIN_SUCCESS/LOGIN_ERROR (#94) - see ADR 0022. No Postgres access
      # at all, unlike the monolith it replaced.
      SPRING_RABBITMQ_HOST: rabbitmq
      # Only this service's own calls to Keycloak move to the internal
      # service name; issuer-uri/authorization-uri keep their
      # application.yml default (localhost:8081) since the browser always
      # uses the host-published port. See application.yml's comment and
      # ADR 0020.
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/sdp/protocol/openid-connect/token
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/sdp/protocol/openid-connect/certs
      KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/sdp/protocol/openid-connect/userinfo
    depends_on:
      redis:
        condition: service_started
      # Spring Cloud Stream's RabbitMQ binder retries its own exchange/queue
      # provisioning on startup (unlike the Keycloak OIDC discovery call
      # below), so `service_started` is enough here - no custom healthcheck
      # needed just for this ordering.
      rabbitmq:
        condition: service_started
      # A plain `depends_on` only waits for the container to start, not for
      # Keycloak's HTTP service inside it to actually be ready - Spring
      # Security's OIDC discovery call at startup is synchronous and doesn't
      # retry, so a not-yet-ready Keycloak fails the whole gateway to start.
      keycloak:
        condition: service_healthy
    # Added for issue #103/ADR 0031: `proxy` depends on this being actually
    # ready (Spring Boot/Netty listening), not just "container started" -
    # without it, `proxy` starts forwarding to a gateway whose JVM is still
    # booting (~9s), and every request 502s until it catches up. Same
    # curl-the-actuator-health-endpoint shape as Keycloak's healthcheck
    # above, adapted since this image has curl rather than needing the
    # /dev/tcp trick (no HTTP client at all in Keycloak's own base image).
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  market-data-service:
    image: sdp-market-data-service:latest
    networks:
      - internal
    # No host-published port - internal-only per ADR 0021, reached only by
    # other containers on this network. Publishes PRICE_TICK to RabbitMQ's
    # fanout exchange as of #90 - the Gateway's consumer role is documented
    # on `gateway` above (see ADR 0022).
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_started

  trading-service:
    image: sdp-trading-service:latest
    networks:
      - internal
    # No host-published port - same reasoning as market-data-service above.
    # Owns R2DBC/Postgres access and publishes TRADE_CREATED/TRADE_REJECTED
    # to RabbitMQ fanout exchanges as of #91 (see ADR 0022's update) - the
    # Gateway's consumer role is documented on `gateway` above.
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/sdp
      SPRING_R2DBC_USERNAME: sdp
      SPRING_R2DBC_PASSWORD: sdp
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started

  postgres:
    # postgres:17-alpine, pinned by digest for reproducible builds
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    networks:
      - internal
    environment:
      POSTGRES_DB: sdp
      POSTGRES_USER: sdp
      POSTGRES_PASSWORD: sdp
    # Published for the "without Docker" native dev path (README.md), where
    # trading-service runs as a host process rather than a container and has
    # no other way to reach it - see ADR 0021. Everything running *inside*
    # this compose stack still only reaches it via the internal network
    # below.
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
    # No host-published port as of issue #103/ADR 0031 - reachable only from
    # `proxy` over the `public` network, same reasoning as `gateway` above.
    networks:
      - public
    depends_on:
      gateway:
        condition: service_healthy

  # Unifies frontend's and gateway's browser-facing origins onto one port
  # (issue #103, ADR 0031) - local dev only, no TLS. See proxy/nginx.conf.
  proxy:
    build:
      context: ./proxy
    networks:
      - public
    # Reuses 8080 - gateway's own former default - so VITE_WS_URL/
    # VITE_LOGIN_URL and Keycloak's registered redirectUris need no change.
    ports:
      - "8080:80"
    depends_on:
      # condition: service_healthy, not just service_started - see
      # gateway's own healthcheck comment for why (issue #103/ADR 0031).
      gateway:
        condition: service_healthy
      frontend:
        condition: service_started

  redis:
    # redis:7-alpine, pinned by digest for reproducible builds
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    networks:
      - internal
    # Published for the "without Docker" native dev path - see the same
    # reasoning as postgres's ports comment above, and ADR 0021.
    ports:
      - "6379:6379"

  rabbitmq:
    # rabbitmq:4-management-alpine, pinned by digest for reproducible builds
    image: rabbitmq@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
    networks:
      - internal
    # AMQP (5672) is published too, as of #90 (see ADR 0021's "Update"
    # notes): `gateway` (the monolith's replacement as of #94) speaks AMQP
    # directly and supports running as a native host process (README's
    # "Without Docker" path) with no other route to RabbitMQ - the same
    # carve-out already made for postgres/redis above, extended here for
    # the same reason. Everything running *inside* this compose stack still
    # reaches it via the internal network regardless. The management UI
    # (15672) is published anyway, same as this project's other admin UIs
    # (e.g. Keycloak's own console).
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    # keycloak:26.7.1, pinned by digest for reproducible builds
    image: quay.io/keycloak/keycloak@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    command: start-dev --import-realm
    networks:
      - public
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixes the "iss" claim Keycloak embeds in every issued token to a
      # single value, regardless of which path (browser via localhost:8081,
      # or gateway via the internal keycloak:8080 service name) a given
      # request arrived on - otherwise Keycloak would derive it from each
      # request's own Host header, and Spring Security's iss-claim
      # validation (application.yml's issuer-uri) would only match one path.
      #
      # Must be a full URL, not a bare hostname: Keycloak 26 defaults to the
      # "hostname v2" provider, which has no hostname-port/hostname-strict
      # options (those are v1-only and are silently ignored, logged only as
      # a startup WARNING) - the port has to be part of this URL itself, or
      # v2 falls back to the container's actual internal port (8080) for
      # the issuer instead of the host-published one (8081), so the token
      # minted for the browser and the issuer expected when the gateway
      # calls userinfo/jwks disagree and every login fails with the OAuth2
      # client's [invalid_user_info_response] Token verification failed /
      # Keycloak's own "Invalid token issuer" error.
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/sdp-realm.json:/opt/keycloak/data/import/sdp-realm.json
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          echo -en "GET /realms/sdp/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          timeout 3 cat <&3 | grep -q "200 OK"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  # `proxy` (the only service exposed to the browser as of issue #103/ADR
  # 0031, replacing `gateway` in that role) and Keycloak (for the
  # browser-driven OAuth2 redirect) - both reachable from the host.
  # `gateway` and `frontend` also join this network so `proxy` can reach
  # them, but neither has its own host-published port anymore. See ADR 0021
  # for the trust-boundary reasoning.
  public:
  # Postgres, Redis, RabbitMQ, market-data-service, and trading-service.
  # `gateway` also joins this network (see its own comment above) since it
  # needs to reach redis/rabbitmq directly, not just be reached by `proxy`.
  # Deliberately NOT marked `internal: true`: that flag disables
  # host port publishing entirely for every service solely attached to it
  # (a real, documented Compose behavior, not just a routing restriction) -
  # which would break postgres/redis's own `ports:` entries, kept for the
  # native dev path, and rabbitmq's management UI. "Internal" here means
  # "no `ports:` entry, reached only by other containers on this network" -
  # a convention this file's services follow, not something Compose itself
  # enforces structurally. See ADR 0021.
  internal:

volumes:
  postgres-data:
