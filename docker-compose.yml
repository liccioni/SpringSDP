services:
  backend:
    image: sdp-backend:latest
    networks:
      - public
      - internal
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/sdp
      SPRING_R2DBC_USERNAME: sdp
      SPRING_R2DBC_PASSWORD: sdp
      SPRING_DATA_REDIS_HOST: redis
      # Temporary consumer of market-data-service's PRICE_TICK fanout
      # exchange (see ADR 0022, issue #90).
      SPRING_RABBITMQ_HOST: rabbitmq
      # Only the backend-to-Keycloak calls move to the internal service
      # name; issuer-uri/authorization-uri keep their application.yml
      # default (localhost:8081) since the browser always uses the
      # host-published port. See application.yml's comment and ADR 0020.
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/sdp/protocol/openid-connect/token
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/sdp/protocol/openid-connect/certs
      KEYCLOAK_USER_INFO_URI: http://keycloak:8080/realms/sdp/protocol/openid-connect/userinfo
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      # Spring Cloud Stream's RabbitMQ binder retries its own exchange/queue
      # provisioning on startup (unlike the Keycloak OIDC discovery call
      # below), so `service_started` is enough here - no custom healthcheck
      # needed just for this ordering.
      rabbitmq:
        condition: service_started
      # A plain `depends_on` only waits for the container to start, not for
      # Keycloak's HTTP service inside it to actually be ready - Spring
      # Security's OIDC discovery call at startup is synchronous and doesn't
      # retry, so a not-yet-ready Keycloak fails the whole backend to start.
      keycloak:
        condition: service_healthy

  # Skeleton services from #89 - stand up alongside the still-running
  # monolith `backend` above to prove the multi-service shape works
  # (strangler-fig, not a big-bang cutover). Nothing has migrated onto any
  # of them yet; each is just a bare Spring Boot app with an actuator health
  # endpoint. See ADR 0022 for the service boundaries and migration plan
  # #90-#94 carry out.
  gateway:
    image: sdp-gateway:latest
    networks:
      - public
    # Will become "the only service exposed to the browser" once #94
    # decommissions the monolith - joins `public` now per ADR 0021's own
    # stated consequence ("once #89 scaffolds the Gateway... only the
    # actual Gateway joins public"). Published on a different host port
    # than the monolith's 8080 so both can run side by side meanwhile.
    ports:
      - "8082:8080"

  market-data-service:
    image: sdp-market-data-service:latest
    networks:
      - internal
    # No host-published port - internal-only per ADR 0021, reached only by
    # other containers on this network. Publishes PRICE_TICK to RabbitMQ's
    # fanout exchange as of #90 - the monolith's temporary consumer role is
    # documented on `backend` above (see ADR 0022).
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_started

  trading-service:
    image: sdp-trading-service:latest
    networks:
      - internal
    # Same reasoning as market-data-service above. R2DBC/Postgres access
    # isn't wired yet - nothing migrates in #89, so there's no real query to
    # justify it; lands with #92-#93 (see ADR 0022).

  postgres:
    # postgres:17-alpine, pinned by digest for reproducible builds
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    networks:
      - internal
    environment:
      POSTGRES_DB: sdp
      POSTGRES_USER: sdp
      POSTGRES_PASSWORD: sdp
    # Published for the "without Docker" native dev path (README.md), where
    # the backend runs as a host process rather than a container and has no
    # other way to reach it - see ADR 0021. Everything running *inside* this
    # compose stack still only reaches it via the internal network below.
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
    networks:
      - public
    ports:
      - "5173:80"
    depends_on:
      - backend

  redis:
    # redis:7-alpine, pinned by digest for reproducible builds
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    networks:
      - internal
    # Published for the "without Docker" native dev path - see the same
    # reasoning as postgres's ports comment above, and ADR 0021.
    ports:
      - "6379:6379"

  rabbitmq:
    # rabbitmq:4-management-alpine, pinned by digest for reproducible builds
    image: rabbitmq@sha256:44bf7eb50fe1765885659e49ccfdc775f8e531964d979321aee380a071f49f94
    networks:
      - internal
    # AMQP (5672) is now published too, as of #90 (see ADR 0021's "Update"
    # note): the still-running monolith `backend` speaks AMQP as a
    # temporary consumer, and it supports running as a native host process
    # (README's "Without Docker" path) with no other route to RabbitMQ -
    # the same carve-out already made for postgres/redis above, extended
    # here for the same reason. Everything running *inside* this compose
    # stack still reaches it via the internal network regardless. The
    # management UI (15672) is published anyway, same as this project's
    # other admin UIs (e.g. Keycloak's own console).
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    # keycloak:26.7.1, pinned by digest for reproducible builds
    image: quay.io/keycloak/keycloak@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    command: start-dev --import-realm
    networks:
      - public
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Fixes the "iss" claim Keycloak embeds in every issued token to a
      # single value, regardless of which path (browser via localhost:8081,
      # or backend via the internal keycloak:8080 service name) a given
      # request arrived on - otherwise Keycloak would derive it from each
      # request's own Host header, and Spring Security's iss-claim
      # validation (application.yml's issuer-uri) would only match one path.
      #
      # Must be a full URL, not a bare hostname: Keycloak 26 defaults to the
      # "hostname v2" provider, which has no hostname-port/hostname-strict
      # options (those are v1-only and are silently ignored, logged only as
      # a startup WARNING) - the port has to be part of this URL itself, or
      # v2 falls back to the container's actual internal port (8080) for
      # the issuer instead of the host-published one (8081), so the token
      # minted for the browser and the issuer expected when the backend
      # calls userinfo/jwks disagree and every login fails with the OAuth2
      # client's [invalid_user_info_response] Token verification failed /
      # Keycloak's own "Invalid token issuer" error.
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/sdp-realm.json:/opt/keycloak/data/import/sdp-realm.json
    healthcheck:
      test:
        - CMD-SHELL
        - >
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          echo -en "GET /realms/sdp/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          timeout 3 cat <&3 | grep -q "200 OK"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  # The monolith `backend` (still dual-network - a temporary stand-in until
  # #94 decommissions it, see ADR 0021), the real `gateway` skeleton #89
  # scaffolded alongside it, and Keycloak (for the browser-driven OAuth2
  # redirect) - all reachable from the host. See ADR 0021 for the
  # trust-boundary reasoning.
  public:
  # Postgres, Redis, RabbitMQ, and the market-data-service/trading-service
  # skeletons #89 scaffolded. Deliberately NOT marked `internal: true`: that
  # flag disables
  # host port publishing entirely for every service solely attached to it
  # (a real, documented Compose behavior, not just a routing restriction) -
  # which would break postgres/redis's own `ports:` entries, kept for the
  # native dev path, and rabbitmq's management UI. "Internal" here means
  # "no `ports:` entry, reached only by other containers on this network" -
  # a convention this file's services follow, not something Compose itself
  # enforces structurally. See ADR 0021.
  internal:

volumes:
  postgres-data:
