services:
  backend:
    image: sdp-backend:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/sdp
      SPRING_R2DBC_USERNAME: sdp
      SPRING_R2DBC_PASSWORD: sdp
    depends_on:
      - postgres

  postgres:
    # postgres:17-alpine, pinned by digest for reproducible builds
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: sdp
      POSTGRES_USER: sdp
      POSTGRES_PASSWORD: sdp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  redis:
    # redis:7-alpine, pinned by digest for reproducible builds
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    ports:
      - "6379:6379"

  keycloak:
    # keycloak:26.7.1, pinned by digest for reproducible builds
    image: quay.io/keycloak/keycloak@sha256:f1f1f01e472c8a78df40d8f2a49a925274eda4d3d80d5f6edbb5c880ee3c01c6
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/sdp-realm.json:/opt/keycloak/data/import/sdp-realm.json

volumes:
  postgres-data:
