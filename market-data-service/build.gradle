plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'com.google.cloud.tools.jib' version '3.5.4'
	id 'com.adarshr.test-logger' version '4.0.0'
}

group = 'com.sdp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Will eventually own market/'s price generation (see issue #89) - for
	// now just webflux + actuator, until #90 migrates the real flow.
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'com.sdp:contracts'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

jacoco {
	toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		csv.required = true
		html.required = true
	}
}

jib {
	from {
		// eclipse-temurin:21-jre, pinned by digest - same base image as
		// backend's, see ADR 0005.
		image = 'eclipse-temurin@sha256:8cef5fc7bebe421363ab543a2f4db5caf7d119d8db67d56b0f56c485d2de4d55'
	}
	to {
		image = "sdp-market-data-service:${project.version}"
		tags = ['latest']
	}
	container {
		ports = ['8080']
		creationTime = 'USE_CURRENT_TIMESTAMP'
	}
}
