server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Vite's hashed asset filenames (index-<hash>.js/.css) change whenever
    # their content does, so index.html - the one file that references
    # them by name - must never be served from a stale cache. The
    # nginx:alpine base image's default config has no Cache-Control on
    # anything; without this, a browser that visited before a rebuild can
    # keep rendering an old bundle under the same URL indefinitely.
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
