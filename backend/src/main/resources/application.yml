server:
  port: 8080

spring:
  application:
    name: sdp-backend
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/sdp
    username: sdp
    password: sdp
    pool:
      # Disabled for now: with r2dbc-pool on the classpath, Spring Boot pools
      # by default and eagerly opens connections on startup (pool.initial-size
      # defaults to 10), which would make the Spring context - and every plain
      # unit test - require a live Postgres. Nothing queries the database yet
      # (that's #22), so there's no reason to pay that cost until there is.
      enabled: false
